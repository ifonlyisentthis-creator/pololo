name: polarity
description: "Polarity - A premium 1-tap physics arcade game."
publish_to: 'none'
version: 1.0.7+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Persistence & Security
  shared_preferences: ^2.5.3
  crypto: ^3.0.7

  # Ads & Monetization
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Audio & Haptics
  audioplayers: ^6.2.0
  vibration: ^3.2.0

  # Social & Virality
  share_plus: ^13.1.0
  screenshot: ^3.0.0
  games_services: ^5.1.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.1

  # Utilities
  wakelock_plus: ^1.7.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4


flutter_native_splash:
  color: "#000000"
  image: "assets/icon/icon.png"
  fullscreen: true
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#000000"
    image: "assets/icon/icon.png"
    icon_background_color: "#000000"
    fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
